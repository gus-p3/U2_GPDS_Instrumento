global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend-api.railway.internal:8081']

  - job_name: frontend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['frontend.railway.internal:8080']
